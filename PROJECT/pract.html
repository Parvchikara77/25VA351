<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        .menu a{
            display: inline-block;
            padding: 8px 16px;
            margin-right: 8px;
            background: #cb9191;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .menu a:hover{
            background: #a66f6f;
        }

        /* Table  */
        table{
            border-collapse: collapse;
            margin-top:20px;
            width: 100%;
        }
        th,td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th{
            background: #f0f0f0;
        }
        /* Button */

        button{
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
        }

        .cart-btn{
            background: #4CAF50;
        }
        .cart-btn:hover{
            background: #357a38;
        }

        footer{
            margin-top: 20px;
        }
        .location-btn {
            padding: 8px 16px;
            background: #cb9191;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .location-btn:hover {
            background: #a66f6f;
        }
       
    </style>
</head>
<body>
    <div class="menu"> 
        <h2>
            <a href="#">Home</a> |
            <a href="#">Subject</a> |
            <a href="#"> Payment</a> |
            <a href="#">Login</a> 
        </h2>

        <table border ="1" cellpadding="8">
            <tr>
                <th>S.No.</th>
                <th>Subject</th>
                <th>Price</th>
                <th>Book</th>
                <th>Add to Cart</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Mathematics</td>
                <td>$50</td>
                <td><img src="math-book.jpg" alt="Mathematics Book" width="100" height="150"></td>
                <td><button class="cart-btn">Add to Cart</button></td>
            </tr>

            <tr>
                <td>2</td>
                <td>Physics</td>
                <td>$60</td>
                <td><img src="physics-book.jpg" alt="Physics Book" width="100" height="150"></td>
                <td><button class="cart-btn">Add to Cart</button></td>
            </tr>

            <tr>
                <td>3</td>
                <td>Chemistry</td>
                <td>$55</td>
                <td><img src="chemistry-book.jpg" alt="Chemistry Book" width="100" height="150"></td>
                <td><button class="cart-btn">Add to Cart</button></td>
            </tr>

            <tr>
                <td>4</td>
                <td>Biology</td>
                <td>$50</td>
                <td><img src="biology-book.jpg" alt="Biology Book" width="100" height="150"></td>
                <td><button class="cart-btn">Add to Cart</button></td>
            </tr>

            <tr>
                <td>5</td>
                <td>Computer Science</td>
                <td>$70</td>
                <td><img src="cs-book.jpg" alt="Computer Science Book" width="100" height="150"></td>
                <td><button class="cart-btn">Add to Cart</button></td>
            </tr>
        </table>

        <br>
        <p>
            <b>Logo</b> ABC Limited Company
            &nbsp;&nbsp;
            <a href="https://maps.google.com" target="_blank">Google Map</a>
        </p>
    </div>
    
</body>
</html>
